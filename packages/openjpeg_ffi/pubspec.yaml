name: openjpeg_ffi
description: "Dart FFI bindings to OpenJPEG for decoding raw JPEG2000 codestreams, built via native-assets — no manual native setup required."
version: 0.1.0
homepage: https://github.com/kiu-chan/svs/tree/main/packages/openjpeg_ffi
repository: https://github.com/kiu-chan/svs
issue_tracker: https://github.com/kiu-chan/svs/issues
topics:
  - ffi
  - jpeg2000
  - image
  - codec

environment:
  sdk: ^3.12.2

dependencies:
  code_assets: ^1.0.0
  ffi: ^2.1.4
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
