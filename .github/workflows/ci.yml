name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # openjpeg_ffi moved out to its own standalone repo
  # (github.com/kiu-chan/openjpeg_ffi) and is published to pub.dev — svs
  # depends on it as a normal hosted package now, so its own CI lives in
  # its own repo.
  svs:
    name: svs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Real-file integration tests live in the sibling svs_example repo and
      # need the (gitignored, multi-hundred-MB) sample_data/*.svs files, so
      # they're not run here — every test in this package's own suite skips
      # gracefully rather than failing when a real file isn't present (see
      # each test file's `_skipReasonUnless` helper). Resolving and running
      # this suite still exercises openjpeg_ffi's native build as a
      # transitive dependency, proving the cross-platform toolchain wiring
      # end-to-end.
      - run: flutter test
