name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # openjpeg_ffi moved out to its own standalone repo
  # (github.com/kiu-chan/openjpeg_ffi) and is published to pub.dev — svs
  # depends on it as a normal hosted package now, so its own CI lives in
  # its own repo.
  svs:
    name: svs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Real-file integration tests live in the sibling svs_example repo and
      # need the (gitignored, multi-hundred-MB) sample_data/*.svs files, so
      # they're not run here — every test in this package's own suite skips
      # gracefully rather than failing when a real file isn't present (see
      # each test file's `_skipReasonUnless` helper). Resolving and running
      # this suite still exercises openjpeg_ffi's native build as a
      # transitive dependency, proving the cross-platform toolchain wiring
      # end-to-end.
      - run: flutter test

  # Compile-only check that the package (and the example app that depends on
  # it) actually builds for web — `flutter test`/`flutter analyze` above
  # don't catch this: dart:io/dart:isolate usage that leaks out of a
  # conditional-export split fails here (a real web compile) even though it
  # can look clean under `flutter analyze` (which doesn't resolve
  # `dart.library.io` the same way a real per-platform compile does). Then
  # the web-capable tests run in Chrome, which ubuntu-latest ships with — one
  # OS is enough for both.
  svs-web:
    name: svs (web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter build web
        working-directory: example
      # The tests that exercise web-only behavior — the pure-Dart codecs,
      # opening a slide without a filesystem (BlobByteSource included), and
      # BigTIFF's 64-bit fields, which dart2js can't read with ByteData's own
      # accessors. Listed by name because a web test run compiles every file
      # it's given, @TestOn('vm') ones too, and those import dart:io.
      - run: flutter pub get
      - run: >-
          flutter test --platform chrome
          test/blob_byte_source_test.dart
          test/codec_portable_test.dart
          test/svs_file_bytes_test.dart
          test/tiff_bigtiff_portable_test.dart
