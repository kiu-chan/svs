name: svs
description: "Streams and renders Aperio SVS whole-slide images of any size, TIFF & BigTIFF: pan/zoom, LOD tile streaming, JPEG & JPEG2000, no full-image load."
version: 1.5.0
homepage: https://github.com/kiu-chan/svs
repository: https://github.com/kiu-chan/svs
issue_tracker: https://github.com/kiu-chan/svs/issues
funding:
  - https://ko-fi.com/monlycute
topics:
  - image
  - medical
  - widget

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: an independent decoder to check this package's own encoders
  # against, and a quick way to build JPEG fixtures.
  image: ^4.9.2
  # Test-only, likewise for JPEG2000: OpenJPEG, to check this package's own
  # JPEG2000 decoder and encoder against.
  openjpeg_ffi: ^0.3.1

flutter:
